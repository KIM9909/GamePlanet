version: '3.8'

services:
  openvidu-server:
    image: openvidu/openvidu-server-kms:2.22.0
    ports:
      - "4443:4443"               # HTTPS
      - "3478:3478/udp"          # STUN/TURN 등
      - "49152-65535:49152-65535/udp"  # 미디어 스트리밍 포트
    environment:
      - OPENVIDU_PUBLICURL=https://boardjjigae.duckdns.org
      - DOMAIN_OR_PUBLIC_IP=boardjjigae.duckdns.org
      - OPENVIDU_COTURN_IP=boardjjigae.duckdns.org
      - OPENVIDU_COTURN_PORT=3478
      # - OPENVIDU_SECRET=YOUR_SECRET
      - CERT_TYPE=letsencrypt
      - LETSENCRYPT_EMAIIL=aruesin2@gmail.com
      - LETSENCRYPT_DOMAIN=boardjjigae.duckdns.org
    restart: unless-stopped
    networks:
      - meeple_network

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - meeple_network

  meeple_front:
    image: kimgon/meeple_front:latest  # Docker Hub 이미지 이름
    restart: always
    ports:
      - "3000:80" # 호스트의 3000 포트를 컨테이너의 80 포트에 매핑
    networks:
      - meeple_network

  meeple_back:
    image: kimgon/meeple_back:latest  # Docker Hub 이미지 이름
    restart: always
    ports:
      - "8090:8090"
    networks:
      - meeple_network

  nginx:
    image: kimgon/nginx:latest  # Docker Hub 이미지 이름
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./webroot:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"  # HTTPS 포트 (옵션)
    depends_on:
      - meeple_front
      - meeple_back
      - certbot
      - openvidu-server
    networks:
      - meeple_network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - cert-data:/etc/letsencrypt
      - ./webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'if [ ! -f /etc/letsencrypt/live/boardjjigae.duckdns.org/fullchain.pem ]; then certbot certonly --webroot --webroot-path=/var/www/certbot -d boardjjigae.duckdns.org -d www.boardjjigae.duckdns.org --email aruesin2@example.com --agree-tos --non-interactive; fi'"
    networks:
      - meeple_network

  certbot-renew:
    image: certbot/certbot
    container_name: certbot-renew
    volumes:
      - cert-data:/etc/letsencrypt
      - ./webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'while true; do certbot renew --webroot --webroot-path=/var/www/certbot && docker exec nginx nginx -s reload && sleep 12h; done'"
    networks:
      - meeple_network

networks:
  meeple_network:
    driver: bridge

volumes:
  cert-data:
