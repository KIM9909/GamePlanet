version: '3.8'

services:
  meeple_front:
    build:
      context: ./meeple_front
    container_name: meeple_front
    restart: always
    ports:
      - "3000:80" # 호스트의 3000 포트를 컨테이너의 80 포트에 매핑
    networks:
      - meeple_network

  meeple_back:
    build:
      context: ./meeple_back
    container_name: meeple_back
    restart: always
    ports:
      - "8090:8090"
    networks:
      - meeple_network

  nginx:
    build:
      context: ./nginx
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - meeple_front
      - meeple_back
    networks:
      - meeple_network

networks:
  meeple_network:
    driver: bridge