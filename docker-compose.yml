version: '3.8'

services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - meeple_network

  meeple_front:
    image: kimgon/meeple_front:latest  # Docker Hub 이미지 이름
    restart: always
    ports:
      - "3000:80" # 호스트의 3000 포트를 컨테이너의 80 포트에 매핑
    networks:
      - meeple_network

  meeple_back:
    image: kimgon/meeple_back:latest  # Docker Hub 이미지 이름
    restart: always
    ports:
      - "8090:8090"
    networks:
      - meeple_network

  nginx:
    image: kimgon/nginx:latest  # Docker Hub 이미지 이름
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
      - "443:443"  # HTTPS 포트 (옵션)
    depends_on:
      - meeple_front
      - meeple_back
    networks:
      - meeple_network

  certbot-renew:
    image: certbot/certbot
    volumes:
      - cert-data:/etc/letsencrypt
      - ./webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'while true; do certbot renew --webroot --webroot-path=/var/www/certbot && sleep 12h; done'"



networks:
  meeple_network:
    driver: bridge